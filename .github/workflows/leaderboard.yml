name: Refresh leaderboard

# Pulls the current month's wager totals from Rainbet and commits the snapshot.
# Netlify watches this branch and redeploys on the resulting push, so this
# workflow only has to produce the data.

on:
  # Cron is UTC. Europe/London is UTC+0 in winter and UTC+1 in summer, so both
  # entries are scheduled and whichever lands on UK midnight does the real work;
  # the other is a harmless extra refresh.
  schedule:
    - cron: '2 0 * * *'   # 00:02 UTC — UK midnight during GMT (winter)
    - cron: '2 23 * * *'  # 23:02 UTC — UK midnight during BST (summer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      RAINBET_API_KEY: ${{ secrets.RAINBET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the API key is present
        run: |
          if [ -z "$RAINBET_API_KEY" ]; then
            echo "::error::RAINBET_API_KEY secret is not set — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Fetch latest wager totals
        run: node scripts/fetch-leaderboard.mjs

      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No leaderboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh leaderboard data"
          git push origin HEAD:${{ github.ref_name }}
